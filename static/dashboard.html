<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SelfHealCI Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f1117; color: #e4e4e7; margin: 0; padding: 2rem; }
        h1 { color: #fff; }
        .controls { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        input, button { padding: 0.6rem; font-size: 0.9rem; border-radius: 6px; border: 1px solid #333; }
        input { flex: 1; background: #1a1d27; color: #fff; }
        button { background: #4f46e5; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #4338ca; }
        button:disabled { background: #555; cursor: not-allowed; }
        .incident { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-right: 0.5rem; }
        .badge.pending { background: #78350f; color: #fbbf24; }
        .badge.success { background: #14532d; color: #4ade80; }
        .badge.failed { background: #7f1d1d; color: #f87171; }
        .category { color: #a5b4fc; font-size: 0.85rem; }
        .error-msg { font-family: monospace; background: #0f1117; padding: 0.5rem; border-radius: 4px; margin: 0.5rem 0; font-size: 0.85rem; overflow-x: auto; }
        .fix-text { font-size: 0.9rem; color: #cbd5e1; }
        .meta { font-size: 0.75rem; color: #71717a; margin-top: 0.5rem; }
        #status { margin-top: 0.5rem; font-size: 0.85rem; color: #a5b4fc; }
    </style>
</head>
<body>
        <h1>🩹 SelfHealCI Dashboard</h1>
    <div id="authStatus" style="margin-bottom: 1rem; font-size: 0.9rem;"></div>

        <div class="controls" id="controlsDiv" style="display:none;">
                <select id="repoInput" onchange="updateWatchButton()" style="flex:1; padding:0.6rem; background:#1a1d27; color:#fff; border:1px solid #333; border-radius:6px;">
            <option value="">Log in to load your repos...</option>
        </select>
        <button id="runBtn" onclick="runAgent()">Run Agent</button>
        <button onclick="loadIncidents()">Refresh</button>
        <button id="watchBtn" onclick="toggleWatch()">☆ Watch</button>
    </div>
        <div id="status"></div>
    <div id="analytics" style="margin: 1.5rem 0; display: flex; gap: 1rem; flex-wrap: wrap;"></div>

    <div id="incidents">Loading...</div>

    <script>
                async function loadIncidents() {
            const container = document.getElementById('incidents');
            container.innerHTML = 'Loading...';
            const res = await fetch('/incidents');

            if (res.status === 401) {
                container.innerHTML = '<p>Connect your GitHub account above to see your incidents.</p>';
                return;
            }

            const data = await res.json();

            if (data.length === 0) {
                container.innerHTML = '<p>No incidents yet.</p>';
                return;
            }

                        container.innerHTML = data.map(inc => {
                let badgeClass = 'pending', badgeText = 'PENDING';
                if (inc.success === true) { badgeClass = 'success'; badgeText = 'FIXED'; }
                if (inc.success === false) { badgeClass = 'failed'; badgeText = 'NOT FIXED'; }

                const confirmButtons = inc.success === null ? `
                    <div style="margin-top: 0.75rem;">
                        <button onclick="confirmIncident(${inc.id}, true)" style="background:#166534; font-size:0.8rem; padding:0.4rem 0.8rem;">✓ Mark Fixed</button>
                        <button onclick="confirmIncident(${inc.id}, false)" style="background:#991b1b; font-size:0.8rem; padding:0.4rem 0.8rem;">✗ Mark Not Fixed</button>
                    </div>
                ` : '';

                return `
                    <div class="incident">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <span class="category">${inc.category}</span>
                        <div class="error-msg">${escapeHtml(inc.error_message)}</div>
                        <div class="fix-text">${escapeHtml(inc.fix_text)}</div>
                        <div class="meta">${inc.repo} · ${new Date(inc.created_at).toLocaleString()}</div>
                        ${confirmButtons}
                    </div>
                `;
            }).join('');
        }

                    function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function confirmIncident(id, success) {
            await fetch(`/incidents/${id}/confirm?success=${success}`, { method: 'POST' });
            await loadIncidents();

        }        async function runAgent() {
            const repo = document.getElementById('repoInput').value.trim();
            if (!repo) return;

            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = 'Running agent...';

            try {
                const res = await fetch(`/run-agent?repo=${encodeURIComponent(repo)}`, { method: 'POST' });
                const data = await res.json();
                status.textContent = `Done: ${data.status}`;
                await loadIncidents();
            } catch (err) {
                status.textContent = 'Error running agent.';
            } finally {
                btn.disabled = false;
            }
        }

         async function checkAuth() {
            const res = await fetch('/me');
            const data = await res.json();
            const authDiv = document.getElementById('authStatus');
            const controlsDiv = document.getElementById('controlsDiv');

            if (data.logged_in) {
                authDiv.innerHTML = `Logged in as <strong>${data.username}</strong> · <a href="/auth/logout" style="color:#a5b4fc;">Log out</a>`;
                controlsDiv.style.display = 'flex';
                await loadMyRepos();
                await loadAnalytics();
                await loadWatchedRepos();
            } else {
                authDiv.innerHTML = `<a href="/auth/github/login" style="color:#4ade80;">🔗 Connect GitHub</a> to run the agent with your own account`;
                controlsDiv.style.display = 'none';
            }
        }

        async function loadAnalytics() {
            const res = await fetch('/analytics');
            if (!res.ok) return;
            const data = await res.json();
            const el = document.getElementById('analytics');

            const stat = (label, value, color) => `
                <div style="background:#1a1d27; border:1px solid #2a2d3a; border-radius:8px; padding:0.75rem 1.25rem; min-width:110px;">
                    <div style="font-size:1.5rem; font-weight:bold; color:${color || '#fff'};">${value}</div>
                    <div style="font-size:0.75rem; color:#a1a1aa;">${label}</div>
                </div>
            `;

            el.innerHTML =
                stat('Total Incidents', data.total) +
                stat('Fixed', data.fixed, '#4ade80') +
                stat('Not Fixed', data.not_fixed, '#f87171') +
                stat('Pending', data.pending, '#fbbf24') +
                stat('Success Rate', data.success_rate !== null ? data.success_rate + '%' : '—', '#a5b4fc');
        }

        async function loadMyRepos() {
            const select = document.getElementById('repoInput');
            const res = await fetch('/my-repos');
            if (!res.ok) return;
            const repos = await res.json();

            select.innerHTML = repos.map(r =>
                `<option value="${r.full_name}">${r.full_name}${r.private ? ' 🔒' : ''}</option>`
            ).join('');
        }

                let watchedRepos = [];

        async function loadWatchedRepos() {
            const res = await fetch('/watched-repos');
            if (!res.ok) return;
            watchedRepos = await res.json();
            updateWatchButton();
        }

        function updateWatchButton() {
            const repo = document.getElementById('repoInput').value;
            const btn = document.getElementById('watchBtn');
            if (watchedRepos.includes(repo)) {
                btn.textContent = '★ Watching';
                btn.style.background = '#166534';
            } else {
                btn.textContent = '☆ Watch';
                btn.style.background = '#4f46e5';
            }
        }

        async function toggleWatch() {
            const repo = document.getElementById('repoInput').value;
            if (!repo) return;

            if (watchedRepos.includes(repo)) {
                await fetch(`/watched-repos?repo=${encodeURIComponent(repo)}`, { method: 'DELETE' });
            } else {
                await fetch(`/watched-repos?repo=${encodeURIComponent(repo)}`, { method: 'POST' });
            }
            await loadWatchedRepos();
        }

        checkAuth();
        loadIncidents();

    </script>
</body>
</html>
